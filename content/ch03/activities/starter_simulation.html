<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Allied Health Career Navigator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --border: #cbd5e1; --primary: #0284c7; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); padding: 24px; margin: 0; color: #0f172a; }
    .card { max-width: 850px; margin: 0 auto; background: var(--card); border-radius: 12px; padding: 24px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #0f766e; }
    .pill-tabs { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
    .tab-btn { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: 700; }
    .tab-btn.active { background: #0f766e; color: white; border-color: #0f766e; }
    .profile-box { background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 8px; padding: 20px; }
    .profile-box h3 { margin-top: 0; color: #115e59; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .item { background: white; padding: 12px; border-radius: 6px; border: 1px solid #ccfbf1; font-size: 0.95rem; }
    .item strong { color: #0f766e; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Allied Health & Performance Career Navigator</h2>
    <p>Select a clinical or performance pathway to evaluate graduate degree requirements, standard clinical prerequisites, and observation benchmarks.</p>
    <div class="pill-tabs" id="tabContainer"></div>
    <div class="profile-box" id="profileContent"></div>
  </div>

  <script>
    const careers = [
      {
        id: "dpt",
        name: "Physical Therapy (DPT)",
        degree: "Doctor of Physical Therapy (3-year clinical doctorate)",
        accreditation: "CAPTE (Commission on Accreditation in Physical Therapy Education)",
        prereqs: "2 Sems Anatomy & Physiology with Labs, 2 Sems Physics, 2 Sems Chemistry, General Biology, Statistics, General Psychology.",
        hours: "80 - 150+ verified hours across multiple clinical settings (inpatient & outpatient)",
        scope: "Diagnose and treat individuals experiencing movement dysfunction, musculoskeletal injury, neurological impairment, or pain."
      },
      {
        id: "otd",
        name: "Occupational Therapy (OTD/MOT)",
        degree: "Doctor of Occupational Therapy (OTD) or Master of Occupational Therapy (MOT)",
        accreditation: "ACOTE (Accreditation Council for Occupational Therapy Education)",
        prereqs: "Anatomy & Physiology I & II, Statistics, Abnormal Psychology, Developmental/Lifespan Psychology, Medical Terminology, Sociology/Anthropology.",
        hours: "40 - 100+ observation hours across developmental, pediatric, and adult rehabilitation facilities",
        scope: "Facilitate participation and functional independence in meaningful daily activities ('occupations') across the lifespan."
      },
      {
        id: "pa",
        name: "Physician Assistant (PA-C)",
        degree: "Master of Science in Physician Assistant Studies (MPAS / MS)",
        accreditation: "ARC-PA (Accreditation Review Commission on Education for the Physician Assistant)",
        prereqs: "A&P I & II, General Biology, Microbiology with Lab, 2 Sems Chemistry, Organic Chemistry or Biochemistry, Genetics, Statistics.",
        hours: "1,000 - 2,000+ Direct Patient Care (PCE) hours (EMT, CNA, PT Aide, Medical Scribe)",
        scope: "Practice medicine under physician supervision: diagnose illnesses, manage treatment plans, prescribe medications, and assist in surgery."
      },
      {
        id: "cscs",
        name: "Strength & Conditioning (CSCS)",
        degree: "Bachelor's degree in Kinesiology / Exercise Science (Master's required starting 2030 per ERP)",
        accreditation: "NSCA (National Strength and Conditioning Association) via CASCE accreditation",
        prereqs: "Exercise Physiology, Biomechanics, Neuromuscular Conditioning, Program Design, CPR/AED.",
        hours: "300 - 600 hours of collegiate or professional athletic performance internship training",
        scope: "Design and implement sport-specific resistance and conditioning programs for athletic development and injury risk reduction."
      }
    ];

    function showCareer(id) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.id === id));
      const c = careers.find(item => item.id === id);
      document.getElementById('profileContent').innerHTML = `
        <h3>${c.name}</h3>
        <p><strong>Primary Scope:</strong> ${c.scope}</p>
        <div class="grid">
          <div class="item"><strong>Terminal Degree & Timeline:</strong> ${c.degree}</div>
          <div class="item"><strong>Accrediting Agency:</strong> ${c.accreditation}</div>
          <div class="item"><strong>Key Course Prerequisites:</strong> ${c.prereqs}</div>
          <div class="item"><strong>Clinical / Field Hours:</strong> ${c.hours}</div>
        </div>
      `;
    }

    const tc = document.getElementById('tabContainer');
    careers.forEach((c, idx) => {
      const b = document.createElement('button');
      b.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
      b.textContent = c.name;
      b.dataset.id = c.id;
      b.onclick = () => showCareer(c.id);
      tc.appendChild(b);
    });

    showCareer('dpt');
  </script>
</body>
</html>
