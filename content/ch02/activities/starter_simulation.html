<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bioenergetic Pathway Contribution Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --border: #cbd5e1; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); padding: 24px; margin: 0; color: #0f172a; }
    .card { max-width: 800px; margin: 0 auto; background: var(--card); border-radius: 12px; padding: 24px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #1e3a8a; }
    .slider-box { margin: 24px 0; background: #eff6ff; padding: 20px; border-radius: 8px; border: 1px solid #bfdbfe; }
    .slider-box label { font-weight: 700; display: block; margin-bottom: 8px; }
    input[type=range] { width: 100%; cursor: pointer; }
    .readout { font-size: 1.25rem; font-weight: 800; color: #1d4ed8; margin-top: 8px; }
    .bar-wrap { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
    .bar-row { display: flex; align-items: center; gap: 12px; }
    .bar-label { width: 150px; font-weight: 600; font-size: 0.9rem; }
    .bar-track { flex: 1; height: 24px; background: #e2e8f0; border-radius: 12px; overflow: hidden; position: relative; }
    .bar-fill { height: 100%; transition: width 0.3s ease; }
    .fill-pc { background: #ef4444; }
    .fill-glyc { background: #f59e0b; }
    .fill-ox { background: #10b981; }
    .bar-pct { width: 50px; text-align: right; font-weight: 700; font-size: 0.9rem; }
    .notes { margin-top: 24px; padding: 16px; background: #f8fafc; border-radius: 8px; border-left: 4px solid #3b82f6; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Bioenergetics: Energy System Continuum Simulator</h2>
    <p>Adjust maximal exercise duration to model the shifting relative ATP production contribution across the three primary metabolic pathways.</p>
    <div class="slider-box">
      <label for="durSlider">All-Out Maximal Effort Duration: <span id="durVal" class="readout">30 seconds</span></label>
      <input type="range" id="durSlider" min="1" max="180" value="30" oninput="updateSimulation(this.value)">
    </div>
    <div class="bar-wrap">
      <div class="bar-row">
        <span class="bar-label">ATP-PCr (Phosphagen)</span>
        <div class="bar-track"><div id="bar-pc" class="bar-fill fill-pc" style="width:25%;"></div></div>
        <span id="pct-pc" class="bar-pct">25%</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Fast Glycolysis</span>
        <div class="bar-track"><div id="bar-glyc" class="bar-fill fill-glyc" style="width:55%;"></div></div>
        <span id="pct-glyc" class="bar-pct">55%</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Oxidative (Aerobic)</span>
        <div class="bar-track"><div id="bar-ox" class="bar-fill fill-ox" style="width:20%;"></div></div>
        <span id="pct-ox" class="bar-pct">20%</span>
      </div>
    </div>
    <div class="notes" id="pathwayNotes">Loading pathway dynamics...</div>
  </div>

  <script>
    function updateSimulation(seconds) {
      const s = parseInt(seconds, 10);
      let label = s < 60 ? `${s} seconds` : `${(s/60).toFixed(1)} minutes`;
      document.getElementById('durVal').textContent = label;

      let pc, glyc, ox, note;
      if (s <= 10) {
        pc = Math.max(90 - s * 3, 50);
        glyc = Math.min(s * 4, 40);
        ox = 100 - pc - glyc;
        note = "<strong>Immediate Power:</strong> Intramuscular ATP and phosphocreatine (PCr) provide immediate energy without oxygen requirement. Rate of ATP turnover is maximal, but capacity is strictly limited.";
      } else if (s <= 60) {
        pc = Math.max(50 - (s - 10) * 1.5, 5);
        glyc = Math.max(65 - (s - 30) * 0.5, 45);
        ox = 100 - pc - glyc;
        note = "<strong>Anaerobic Lactic Transition:</strong> Glycolytic breakdown of intramuscular glycogen dominates ATP resynthesis, resulting in elevated accumulation of hydrogen ions (H+) and lactate.";
      } else {
        pc = Math.max(5 - (s - 60) * 0.1, 1);
        glyc = Math.max(45 - (s - 60) * 0.3, 10);
        ox = 100 - pc - glyc;
        note = "<strong>Oxidative Predominance:</strong> Beyond 75-90 seconds of continuous maximal exertion, aerobic mitochondrial phosphorylation becomes the primary pathway, metabolizing blood glucose and free fatty acids.";
      }

      document.getElementById('bar-pc').style.width = pc + '%';
      document.getElementById('pct-pc').textContent = Math.round(pc) + '%';
      document.getElementById('bar-glyc').style.width = glyc + '%';
      document.getElementById('pct-glyc').textContent = Math.round(glyc) + '%';
      document.getElementById('bar-ox').style.width = ox + '%';
      document.getElementById('pct-ox').textContent = Math.round(ox) + '%';
      document.getElementById('pathwayNotes').innerHTML = note;
    }

    updateSimulation(30);
  </script>
</body>
</html>
